services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: alandave-mongodb-datasource-mongo
    ports:
      - '27017:27017'
    volumes:
      - ./dev/mongo-seed.js:/docker-entrypoint-initdb.d/mongo-seed.js:ro
